[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-rmt"
dynamic = ["version"]
description = "Random Matrix Theory Python package"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Alejandro Santorum Varela", email = "alejandro.santorum@gmail.com" },
]
keywords = ["RMT", "Random Matrix Theory", "Ensemble", "Covariance matrices"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.21.6,<=1.26.4",
    "scipy>=1.7.3,<=1.12.0",
    "matplotlib>=3.5.3,<=3.8.4",
    "scikit-learn>=1.3.0,<=1.7.0",
]

[project.urls]
Homepage = "https://github.com/AlejandroSantorum/scikit-rmt"
Documentation = "https://scikit-rmt.readthedocs.io/"
Repository = "https://github.com/AlejandroSantorum/scikit-rmt"

[project.optional-dependencies]
dev = [
    "pytest~=8.0.0",
    "pytest-cov~=5.0.0",
    "pylint~=3.0.0",
    "build>=1.0,<2",
    "twine~=5.0.0",
]
docs = ["sphinx>=7.1,<8", "sphinx_rtd_theme", "sphinx-gallery"]

[tool.setuptools.dynamic]
version = { attr = "skrmt._version.__version__" }

[tool.setuptools.packages.find]
include = ["skrmt", "skrmt.*"]
exclude = ["skrmt.*.tests", "skrmt.*.tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"